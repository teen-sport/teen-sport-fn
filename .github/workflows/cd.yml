name: CD

# Workflow reutilizable invocado por el CI tras un push a main que superó pruebas y build.
# Se usa workflow_call en lugar de workflow_run para no ejecutar código de forks
# con acceso a los secretos de despliegue.
on:
  workflow_call:

permissions:
  contents: read

# Nunca dos despliegues a la vez; el que está en curso termina antes de iniciar el siguiente.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 5. Desplegar en Railway
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    container: ghcr.io/railwayapp/cli:5.63.4
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - name: Descargar el commit que pasó el CI
        uses: actions/checkout@v4

      - name: Desplegar
        run: railway up --service="$RAILWAY_SERVICE_ID" --ci

  smoke-test:
    name: 6. Smoke test
    needs: deploy
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Verificar que el front responde
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$APP_URL/" | grep -q "<app-root"; then
              echo "El front está arriba"
              # Una ruta interna debe devolver index.html (fallback del Caddyfile).
              curl -fsS "$APP_URL/login" | grep -q "<app-root"
              echo "Las rutas internas responden"
              exit 0
            fi
            echo "Intento $i: aún no responde, esperando 15 s..."
            sleep 15
          done
          echo "El front no respondió"
          exit 1
