<a class="skip-link" href="#content">Saltar al contenido</a>

<header class="app-header">
  <div class="app-header__inner">
    <a class="app-brand" [routerLink]="homeLink()">
      <img class="app-brand__logo" src="logo.png" alt="" width="48" height="48" />
      <span>TeenSport</span>
    </a>

    <nav class="app-nav" aria-label="Principal">
      @for (item of items(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        >{{ item.label }}</a
      >
      }
    </nav>

    <div class="app-user">
      @if (user(); as current) {
      <a class="app-user__name" routerLink="/profile">
        <span>{{ current.firstNames }} {{ current.lastNames }}</span>
        <small>{{ roleLabel() }}</small>
      </a>
      }
      <button type="button" class="btn-secondary" (click)="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main id="content" class="app-main">
  <router-outlet />
</main>
