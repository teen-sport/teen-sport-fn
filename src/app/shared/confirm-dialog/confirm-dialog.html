<div class="backdrop" (click)="dismiss()">
  <div
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-title"
    [attr.aria-describedby]="message() ? 'confirm-message' : null"
    (click)="$event.stopPropagation()"
  >
    <h2 id="confirm-title">{{ title() }}</h2>

    @if (message()) {
      <p id="confirm-message">{{ message() }}</p>
    }
    @if (reasonLabel(); as label) {
      <div class="field">
        <label for="confirm-reason">{{ label }}</label>
        <textarea
          id="confirm-reason"
          rows="3"
          [formControl]="reason"
          [attr.maxlength]="reasonMaxLength()"
        ></textarea>
      </div>
    }

    <div class="actions">
      <button type="button" [class.btn-danger]="danger()" [disabled]="busy()" (click)="confirm()">
        {{ busy() ? 'Procesando…' : confirmLabel() }}
      </button>
      <button
        #cancelButton
        type="button"
        class="btn-secondary"
        [disabled]="busy()"
        (click)="dismiss()"
      >
        {{ cancelLabel() }}
      </button>
    </div>
  </div>
</div>
