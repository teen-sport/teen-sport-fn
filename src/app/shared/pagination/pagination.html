@if (totalPages() > 1) {
  <nav class="pagination" aria-label="Paginación">
    <button
      type="button"
      class="btn-secondary"
      [disabled]="!hasPrevious()"
      (click)="go(page() - 1)"
    >
      Anterior
    </button>
    <span aria-live="polite">Página {{ page() + 1 }} de {{ totalPages() }}</span>
    <button type="button" class="btn-secondary" [disabled]="!hasNext()" (click)="go(page() + 1)">
      Siguiente
    </button>
  </nav>
}
